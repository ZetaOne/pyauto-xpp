# pixi: one command sets up everything (https://pixi.sh)
#
#   pixi run lab        # JupyterLab in your browser: tutorials/notebooks and tutorials/scripts
#   pixi run scripts    # run every tutorial script, one line each
#   pixi run test       # the package's tests
#
# pixi.lock pins every package; after an update only what changed is downloaded.
[workspace]
name = "pyauto-xpp"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64"]   # Windows: pip install the prebuilt wheel

[dependencies]
python = "3.11.*"
c-compiler = "*"        # only needed to build XPP's C library from source
pip = "*"
setuptools = ">=64"
numpy = "*"
matplotlib = "*"
pandas = "*"
plotly = "*"
ipywidgets = "*"
anywidget = "*"
jupyterlab = "*"
jupytext = "*"          # opens the tutorial .py scripts as notebooks
ipykernel = "*"
pytest = "*"

[pypi-dependencies]
pyauto-xpp = { path = ".", editable = true }

[tasks]
jupytext-default = "python tools/jupytext_default.py"    # .py scripts open as notebooks
lab = { cmd = "jupyter lab tutorials", depends-on = ["jupytext-default"] }
scripts = { cmd = "python run_all.py", cwd = "tutorials/scripts" }
test = "python -m pytest -q tests"
