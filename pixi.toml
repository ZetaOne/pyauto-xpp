# pixi: one command sets up everything (https://pixi.sh)
#
#   pixi run lab        # JupyterLab in your browser: tutorials/notebooks and tutorials/scripts
#   pixi run scripts    # run every tutorial script, one line each
#   pixi run test       # the package's tests
#
# pixi.lock pins every package; after an update only what changed is downloaded.
[workspace]
name = "pyauto-xpp"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
python = "3.11.*"
c-compiler = "*"        # builds XPP's C library once, at install (until prebuilt wheels exist)
pip = "*"
setuptools = ">=64"
numpy = "*"
matplotlib = "*"
pandas = "*"
plotly = "*"
ipywidgets = "*"
anywidget = "*"
jupyterlab = "*"
jupytext = "*"          # opens the tutorial .py scripts as notebooks
ipykernel = "*"
pytest = "*"

[pypi-dependencies]
pyauto-xpp = { path = ".", editable = true }

[tasks]
lab = "jupyter lab tutorials"
scripts = { cmd = "python run_all.py", cwd = "tutorials/scripts" }
test = "python -m pytest -q tests"
