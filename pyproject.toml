[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyauto-xpp"
version = "0.6.0"
description = "XPPAUT and its AUTO for Python: batch simulations, every XPP command, and bifurcation diagrams from scripts"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
dependencies = ["numpy"]

[project.scripts]
pyxpp = "pyxpp.__main__:main"

[project.optional-dependencies]
plot = ["matplotlib"]
pandas = ["pandas"]
test = ["pytest", "matplotlib"]

[tool.setuptools]
packages = ["pyxpp"]

[tool.setuptools.package-data]
pyxpp = ["_libxpp.so", "_libxpp.dylib", "_libxpp.dll", "editor/index.html"]
