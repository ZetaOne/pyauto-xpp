# Prebuilt wheels on every version tag (v*): Linux (x86_64, aarch64) and macOS
# (Intel, Apple Silicon), CPython 3.9-3.15, each built and tested on its own hardware.
# Also runnable by hand (Actions > wheels > Run workflow): builds and tests, no release.
name: wheels
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pypa/cibuildwheel@v4.3.5
        env:
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-* cp315-*"
          CIBW_SKIP: "*t-* *-musllinux_* *-manylinux_i686"
          CIBW_ARCHS: native
          CIBW_ENVIRONMENT: PIP_PREFER_BINARY=1   # test packages: an older wheel rather than a source build
          CIBW_TEST_REQUIRES: "pytest matplotlib"
          CIBW_TEST_COMMAND: "python -m pytest -q {project}/tests"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          generate_release_notes: true
